# Host-specific i3 configuration (gallifrey)

bindsym $mod+F3 exec thunderbird
bindsym $mod+F4 exec keepassxc
bindsym $mod+F5 exec PixInsight
bindsym $mod+F6 exec ~/bin-private/ledger-live
bindsym $mod+F8 exec pavucontrol

# Redundant shortcuts
bindsym $mod+XF86Mail exec thunderbird
bindsym Shift+XF86Mail exec pidgin
bindsym Control+XF86Mail exec discord-canary
bindsym $mod+XF86MyComputer exec thunar
bindsym $mod+XF86HomePage exec brave
bindsym Shift+XF86HomePage exec tor-browser-en
bindsym Control+XF86HomePage exec google-chrome-stable
bindsym $mod+XF86Calculator exec gnome-calculator
bindsym Shift+XF86Calculator exec ~/bin-private/touchpad_toggle.sh

# Screenshot
# bindsym Print exec xfce4-screenshooter
# bindsym Print exec flameshot gui -p ~/Images/screenshots

# Ecran externe
workspace 1 output eDP-1
workspace 5 output HDMI-1
workspace 5 output DP-1
workspace 5 output DP-2
workspace 5 output DP-3

# assign [class="Terminator"] 1
assign [class="zoom"] 3
assign [class="discord"] 3
assign [class="KeePassXC"] 4
assign [class="PixInsight"] 5
for_window [class="zoom" title="^zoom$"] floating enable

# Verrouillage de l'écran lors de la mise en veille / hibernation
exec --no-startup-id ~/bin/xss-lock.sh

# Raccourcis clavier touches spéciales
exec --no-startup-id xbindkeys

# AppArmor notify
exec --no-startup-id aa-notify -p -s 1 -w 60 -f /var/log/audit/audit.log
