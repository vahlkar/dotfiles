- create:
    ~/bin-private:
      mode: 0755

- shell:
    - command: 'chmod 755 "$HOME/bin-private"'
      description: Enforce ~/bin-private permissions

- link:
    ~/.xbindkeysrc: hosts/gallifrey/xbindkeysrc
    ~/.config/i3/host.conf: hosts/gallifrey/i3-host.conf
    ~/.config/sway/host.conf: hosts/gallifrey/sway-host.conf
    ~/.config/kanshi/config: hosts/gallifrey/kanshi.conf
    ~/.config/i3status/config: hosts/gallifrey/i3status.conf
    ~/.config/fish/host.fish: hosts/gallifrey/fish-host.fish
    ~/.config/mpd/mpd.conf: hosts/gallifrey/mpd.conf
    ~/.gnupg-alt-keyring/gpg.conf: gnupg/gpg.conf
    ~/.gnupg-alt-keyring/gpg-agent.conf: gnupg/gpg-agent.conf
    ~/bin-private/borg-update.sh: hosts/gallifrey/bin/borg-update.sh
    ~/bin-private/cups_upgrade.sh: hosts/gallifrey/bin/cups_upgrade.sh
    ~/bin-private/feh_wallpaper.sh: hosts/gallifrey/bin/feh_wallpaper.sh
    ~/bin-private/generate_lock_screen.fish: hosts/gallifrey/bin/generate_lock_screen.fish
    ~/bin-private/music_control_key.sh: hosts/gallifrey/bin/music_control_key.sh
    ~/bin-private/switch_lock_screen.py: hosts/gallifrey/bin/switch_lock_screen.py
    ~/bin-private/touchpad_toggle.sh: hosts/gallifrey/bin/touchpad_toggle.sh
    ~/bin-private/netctl_to_qrcode.sh: hosts/gallifrey/bin/netctl_to_qrcode.sh
    ~/bin-private/smallpdf.sh: hosts/gallifrey/bin/smallpdf.sh
    ~/bin-private/GraXpert:
        path: hosts/gallifrey/bin/GraXpert
        ignore-missing: true
    ~/bin-private/siril:
        path: hosts/gallifrey/bin/siril
        ignore-missing: true
